services:
  - type: web
    name: enterseed-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: enterseed-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/enterseed.sqlite
      - key: FRONTEND_ORIGINS
        value: https://tdalog-cell.github.io
      - key: ADMIN_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: NOMINATIM_USER_AGENT
        value: Enterseed/1.0 (website: https://tdalog-cell.github.io/EnterSeed/)
